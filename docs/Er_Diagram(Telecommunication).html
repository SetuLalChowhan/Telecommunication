<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<h2 class="sr-only">Entity relationship diagram for the telemedicine platform, v3, without payment, including doctor verification and documents</h2>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const themeMode = document.documentElement.dataset.mode;
const dark = themeMode ? themeMode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const src = `erDiagram
  USER ||--o| DOCTOR_PROFILE : has
  USER ||--o| PATIENT_PROFILE : has
  USER ||--o{ ACCOUNT : has
  USER ||--o{ NOTIFICATION : receives
  USER ||--o{ DOCTOR_PROFILE : verifies
  DOCTOR_PROFILE ||--o{ DOCTOR_SPECIALTY : has
  SPECIALTY ||--o{ DOCTOR_SPECIALTY : has
  DOCTOR_PROFILE ||--o{ DOCTOR_DOCUMENT : uploads
  DOCTOR_PROFILE ||--o{ AVAILABILITY : sets
  DOCTOR_PROFILE ||--o{ BOOKING : receives
  PATIENT_PROFILE ||--o{ BOOKING : makes
  PATIENT_PROFILE ||--o{ MEDICAL_REPORT : uploads
  BOOKING ||--o{ MEDICAL_REPORT : attaches
  BOOKING ||--o| REVIEW : gets

  USER {
    string id PK
    string name
    string email
    string role
    string phone
  }
  DOCTOR_PROFILE {
    string id PK
    string userId FK
    int experienceYears
    float fee
    bool verified
    datetime verifiedAt
    string verifiedById FK
    float rating
  }
  DOCTOR_SPECIALTY {
    string doctorId FK
    string specialtyId FK
  }
  SPECIALTY {
    string id PK
    string name
  }
  DOCTOR_DOCUMENT {
    string id PK
    string doctorId FK
    string docType
    string fileUrl
    datetime uploadedAt
  }
  PATIENT_PROFILE {
    string id PK
    string userId FK
    date dateOfBirth
    string address
  }
  AVAILABILITY {
    string id PK
    string doctorId FK
    string dayOfWeek
    string startTime
    string endTime
    int consultationDuration
  }
  BOOKING {
    string id PK
    string doctorId FK
    string patientId FK
    datetime slotStart
    datetime slotEnd
    string status
    string meetLink
    string googleEventId
  }
  MEDICAL_REPORT {
    string id PK
    string patientId FK
    string bookingId FK
    string fileUrl
    datetime uploadedAt
  }
  REVIEW {
    string id PK
    string bookingId FK
    int rating
    string comment
  }
  NOTIFICATION {
    string id PK
    string userId FK
    string type
    string message
    bool isRead
  }
  ACCOUNT {
    string id PK
    string userId FK
    string providerId
    string accessToken
    string refreshToken
  }`;
const { svg } = await mermaid.render('erd-svg', src);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
